name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  verify-challenges:
    name: verify challenge packs
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout challenge catalog
        uses: actions/checkout@v4
        with:
          path: model-validator-challenges

      - name: Checkout framework
        uses: actions/checkout@v4
        with:
          repository: rich-mond/model-validator
          ref: 687ce9724d12a24284f37df9ace40e7af3e31c6b
          path: model-validator

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: model-validator/global.json

      - name: Restore framework
        working-directory: model-validator
        run: dotnet restore ModelValidator.slnx --locked-mode

      - name: Build framework
        working-directory: model-validator
        run: dotnet build ModelValidator.slnx -c Release --no-restore -warnaserror

      - name: Record qualified revisions
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/qualification"
          echo "Framework: $(git -C model-validator rev-parse HEAD)" | tee "$RUNNER_TEMP/qualification/revisions.txt"
          echo "Challenges: $(git -C model-validator-challenges rev-parse HEAD)" | tee -a "$RUNNER_TEMP/qualification/revisions.txt"
          cat "$RUNNER_TEMP/qualification/revisions.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify .NET idempotent processing pack
        working-directory: model-validator
        run: dotnet run --project src/ModelValidator.Cli/ModelValidator.Cli.csproj -c Release --no-build -- challenge verify --path "$GITHUB_WORKSPACE/model-validator-challenges/dotnet/idempotent-processing" | tee "$RUNNER_TEMP/qualification/idempotent-processing.log"

      - name: Verify .NET checkout discounts pack
        working-directory: model-validator
        run: dotnet run --project src/ModelValidator.Cli/ModelValidator.Cli.csproj -c Release --no-build -- challenge verify --path "$GITHUB_WORKSPACE/model-validator-challenges/dotnet/checkout-discounts" | tee "$RUNNER_TEMP/qualification/checkout-discounts.log"

      - name: Verify Python order normalization pack
        working-directory: model-validator
        run: dotnet run --project src/ModelValidator.Cli/ModelValidator.Cli.csproj -c Release --no-build -- challenge verify --path "$GITHUB_WORKSPACE/model-validator-challenges/python/order-normalization" | tee "$RUNNER_TEMP/qualification/order-normalization.log"

      - name: Ensure generated verification output is ignored
        working-directory: model-validator-challenges
        if: always()
        shell: bash
        run: |
          status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            exit 1
          fi

      - name: Record qualification result
        if: always()
        run: |
          echo "Qualification: ${{ job.status }}" | tee "$RUNNER_TEMP/qualification/result.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: challenge-qualification
          path: |
            ${{ runner.temp }}/qualification
            model-validator-challenges/**/verification/pack-verification.json
